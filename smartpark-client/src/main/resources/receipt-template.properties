# SmartPark parking receipt template (built-in defaults).
#
# To customise the receipt on one PC without rebuilding, copy this file as
# `receipt-template.properties` into the folder the client is started from and edit it.
# Keys missing from your copy keep the values below. Several lines are separated with |
# The receipt preview shows the result immediately the next time a receipt is opened.

# ---- Header -------------------------------------------------------------
receipt.title=SmartPark
receipt.subtitle=PARKING TICKET
# Extra lines under the title, e.g. the car park's name, address or phone number (may be empty)
receipt.header.lines=Real-Time Smart Parking

# ---- Big slot code under the header ---------------------------------------
receipt.slot.banner=true
receipt.slot.caption=Your parking slot

# ---- Detail lines, in this order ------------------------------------------
# Available: ticket, vehicle, category, slot, location, slotType, date, time, operator
receipt.fields=ticket,vehicle,category,slot,date,time,operator

receipt.label.ticket=Ticket ID
receipt.label.vehicle=Vehicle No.
receipt.label.category=Category
receipt.label.slot=Slot
receipt.label.location=Location
receipt.label.slotType=Slot type
receipt.label.date=Entry date
receipt.label.time=Entry time
receipt.label.operator=Operator

# java.time patterns (https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/time/format/DateTimeFormatter.html)
receipt.date.pattern=dd MMM yyyy
receipt.time.pattern=HH:mm:ss

# ---- Footer ---------------------------------------------------------------
receipt.footer.lines=Keep this ticket and present it at the exit gate.|Thank you for parking with us.

# Printed on every reprint, followed by the copy number
receipt.copy.marker=DUPLICATE - REPRINT
