# Built-in defaults for the SmartPark client.
#
# To configure a specific PC without rebuilding, create a file named
# `smartpark-client.properties` in the folder you start the client from,
# or pass JVM options such as -Dsmartpark.server.host=192.168.1.10

# IP address or host name of the Admin PC running smartpark-server
smartpark.server.host=localhost
smartpark.server.port=8080

# Identity of this computer: ENTRY-GATE-1, EXIT-GATE-1 or ADMIN
smartpark.terminal.name=ADMIN

# Receipt printer of this computer (Entry PC). Leave empty to use the Windows default printer.
# The operator can still pick another printer in the receipt preview.
smartpark.printer.name=
# AUTO (detect from the printer's paper), THERMAL_80MM, THERMAL_58MM or STANDARD (A4 / Letter)
smartpark.printer.paper=AUTO
