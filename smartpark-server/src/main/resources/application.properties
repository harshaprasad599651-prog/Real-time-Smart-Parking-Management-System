# ============================================================================
#  SmartPark Server configuration
#
#  Every value below can be overridden WITHOUT editing this file:
#    * Environment variables, e.g.  SMARTPARK_MONGODB_URI=mongodb://192.168.1.10:27017
#    * A git-ignored file `application-local.properties` in the directory the
#      server is started from (see application-local.properties.example)
# ============================================================================

spring.application.name=smartpark-server
spring.config.import=optional:file:./application-local.properties

# ---------------------------------------------------------------------------
# MongoDB (local MongoDB Community Server on the Admin PC)
# Only this backend connects to MongoDB; the JavaFX clients talk to the REST API.
# ---------------------------------------------------------------------------
spring.mongodb.uri=${SMARTPARK_MONGODB_URI:mongodb://localhost:27017}
spring.mongodb.database=${SMARTPARK_MONGODB_DATABASE:smartpark_db}
# Indexes are created explicitly (and verified) by MongoIndexInitializer.
spring.data.mongodb.auto-index-creation=false

# ---------------------------------------------------------------------------
# Transactions
#   auto  - use multi-document transactions only if the server is a replica set
#   never - always use the single-document atomic operations + compensation path
# ---------------------------------------------------------------------------
smartpark.mongodb.transactions=${SMARTPARK_MONGODB_TRANSACTIONS:auto}

# ---------------------------------------------------------------------------
# Initial sample data (created only when the collections are empty)
# Change these passwords for any real deployment.
# ---------------------------------------------------------------------------
smartpark.seed.enabled=${SMARTPARK_SEED_ENABLED:true}
smartpark.seed.admin-password=${SMARTPARK_SEED_ADMIN_PASSWORD:Admin@123}
smartpark.seed.entry-password=${SMARTPARK_SEED_ENTRY_PASSWORD:Entry@123}
smartpark.seed.exit-password=${SMARTPARK_SEED_EXIT_PASSWORD:Exit@123}

# Slots marked OCCUPIED with no matching ACTIVE session (e.g. after a crash)
# are released at startup if they are older than this.
smartpark.parking.orphan-slot-grace=PT2M

# ---------------------------------------------------------------------------
# Authentication
#   Clients sign in with POST /api/auth/login and send "Authorization: Bearer <token>".
#   A token expires after this much time without use (sliding expiry).
#   operator-header-enabled=true additionally trusts an "X-Operator: <username>" header
#   WITHOUT a password. Only for tests and experiments; keep it false otherwise.
# ---------------------------------------------------------------------------
smartpark.security.token-idle-timeout=${SMARTPARK_TOKEN_IDLE_TIMEOUT:PT12H}
smartpark.security.operator-header-enabled=${SMARTPARK_ALLOW_OPERATOR_HEADER:false}

# ---------------------------------------------------------------------------
# Web server
# ---------------------------------------------------------------------------
# 0.0.0.0 = listen on all network interfaces so LAN clients can connect.
server.address=0.0.0.0
server.port=${SMARTPARK_SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# API documentation (springdoc-openapi)
#   Swagger UI : http://<server>:8080/swagger-ui.html
#   OpenAPI    : http://<server>:8080/v3/api-docs
# ---------------------------------------------------------------------------
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-produces-media-type=application/json

logging.level.root=INFO
logging.level.com.smartpark=DEBUG
