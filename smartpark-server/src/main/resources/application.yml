# ============================================================================
#  SmartPark Server configuration
#
#  Secrets are NOT stored here. Supply them in one of these ways:
#    1. Environment variables (SMARTPARK_DB_USERNAME, SMARTPARK_DB_PASSWORD, ...)
#    2. A git-ignored file `application-local.yml` placed in the directory the
#       server is started from (copy application-local.yml.example).
# ============================================================================

spring:
  application:
    name: smartpark-server

  config:
    import: optional:file:./application-local.yml

  datasource:
    url: jdbc:mysql://${SMARTPARK_DB_HOST:localhost}:${SMARTPARK_DB_PORT:3306}/${SMARTPARK_DB_NAME:smartpark}?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${SMARTPARK_DB_USERNAME:smartpark}
    password: ${SMARTPARK_DB_PASSWORD:}
    hikari:
      pool-name: SmartParkPool
      maximum-pool-size: 10
      connection-timeout: 10000

  jpa:
    open-in-view: false
    hibernate:
      # Development setting. Will be replaced by versioned schema migrations later.
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false

server:
  # 0.0.0.0 = listen on all network interfaces so LAN clients can connect.
  address: 0.0.0.0
  port: ${SMARTPARK_SERVER_PORT:8080}

logging:
  level:
    root: INFO
    com.smartpark: DEBUG
