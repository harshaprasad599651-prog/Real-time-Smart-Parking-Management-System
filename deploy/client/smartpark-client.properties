# SmartPark client settings for THIS computer. Edit with Notepad, then restart SmartPark.

# LAN IP address of the Admin PC running the SmartPark server.
# The server prints it when it starts ("LAN clients: smartpark.server.host=...").
# Use localhost only on the Admin PC itself.
smartpark.server.host=192.168.1.10
smartpark.server.port=8080

# Name of this computer as shown on the admin dashboard: ENTRY-GATE-1, EXIT-GATE-1 or ADMIN
smartpark.terminal.name=ENTRY-GATE-1

# Receipt printer (Entry PC). Empty = Windows default printer.
smartpark.printer.name=
# AUTO, THERMAL_80MM, THERMAL_58MM or STANDARD (A4 / Letter)
smartpark.printer.paper=AUTO
